name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest   # arm64
          - os: ubuntu-latest  # amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
      - run: go vet ./...
      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "files needing gofmt:"; echo "$unformatted"; exit 1
          fi
      - run: go test ./... -count=1
      - run: go test -race ./internal/... ./test/... -count=1
      - run: go run scripts/check-docs.go

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
      - run: sh scripts/build-release.sh v0.1.0
      - run: GAEBOKCHI_REQUIRE_STAGED_RELEASE=1 go test ./scripts/ -run 'TestVerify|TestStagedReleaseArchives' -count=1
      - run: grep -c '^' dist/gaebokchi-v0.1.0/SHA256SUMS

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: "1.27.1"
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.13.2
          args: --max-issues-per-linter=0 --max-same-issues=0
